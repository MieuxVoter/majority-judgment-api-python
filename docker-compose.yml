# Make sure you either source .env.local or use --env-file like so:
#     docker compose --env-file .env.local --profile all up

services:

  # Postgresql database, nothing fancy
  # https://hub.docker.com/_/postgres
  mj_db:
    profiles:
      - core
      - all
    image: postgres:15
    restart: unless-stopped
    hostname: ${DB_HOST:-mj_db}
    healthcheck:
      start_period: 30s
      test: ["CMD", "pg_isready", "--user", "${DB_USER:-mj}"]
      interval: 10m
      timeout: 10s
      retries: 3
    environment:
      POSTGRES_DB: "${DB_NAME:-mj}"
      POSTGRES_USER: "${DB_USER:-mj}"
      POSTGRES_PASSWORD: "${DB_PASS:?'error: you must pass --env-file=.env.local to the docker compose command'}"
      TZ: "${TIMEZONE:-Europe/Paris}"
    networks:
      - lan
    volumes:
      - "db:/var/lib/postgresql/data"

  # The actual python fastapi we use as backend
  mj_api:
    profiles:
      - core
      - all
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    # Note: we might need --reload here as a last resort
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8877
      --proxy-headers
      --env-file ${ENV_FILE:-.env.local}
    healthcheck:
      start_period: 30s
      test: ['CMD-SHELL', 'curl localhost:8877/liveness -s -f -o /dev/null || exit 1']
      interval: 10m
      timeout: 10s
      retries: 3
    depends_on:
      mj_db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: "${DB_HOST:-mj_db}"
      POSTGRES_USER: "${DB_USER:-mj}"
      POSTGRES_PASSWORD: "${DB_PASS}"
      POSTGRES_DB: "${DB_NAME:-mj}"
      TZ: "${TIMEZONE:-Europe/Paris}"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["*"]}
      SECRET: "${SECRET}"
    # We do not need to expose those
    #ports:
    #  - 8877:8877
    volumes:
      - .:/code
    networks:
      - lan
      - traefik_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_network"
      - "traefik.http.services.mj.loadbalancer.server.port=8877"
      - "traefik.http.routers.mj.entrypoints=websecure"
      - "traefik.http.routers.mj.rule=Host(`${API_PREFIX:-api}.${DOMAIN}`)"
      - "traefik.http.routers.mj.tls=true"
      - "traefik.http.routers.mj.tls.certresolver=leresolver"

  # Microservice to handle the upload of images
  mj_imgpush:
    profiles:
      - image
      - all
    image: hauxir/imgpush:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PUID:-1000}
      TZ: ${TIMEZONE:-Europe/Paris}
      IMAGES_DIR: /images
      MAX_SIZE_MB: 16
      MAX_UPLOADS_PER_DAY: 100
      MAX_UPLOADS_PER_HOUR: 100
      MAX_UPLOADS_PER_MINUTE: 10
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["*"]}
      VALID_SIZES: ${VALID_SIZES:-"[100,200,300]"}
      NAME_STRATEGY: "uuidv4"
    # Restore this healthcheck once the slop code at imgpush has been fixed   GRRRRR
    # See https://github.com/hauxir/imgpush/pull/55
    # healthcheck:
    #   start_period: 30s
    #   test: ['CMD-SHELL', 'curl localhost:5000/liveness -s -f -o /dev/null || exit 1']
    #   interval: 10m
    #   timeout: 10s
    #   retries: 3
    volumes:
      - imgpush:/images
    networks:
      - lan
      - traefik_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_network"
      - "traefik.http.services.imgpush.loadbalancer.server.port=5000"
      - "traefik.http.routers.imgpush.entrypoints=websecure"
      - "traefik.http.routers.imgpush.rule=Host(`imgpush.${DOMAIN}`)"
      - "traefik.http.routers.imgpush.tls=true"
      - "traefik.http.routers.imgpush.tls.certresolver=leresolver"


  # UI to inspect/edit the database
  # https://hub.docker.com/_/adminer/
  mj_adminer:
    profiles:
      - admin
      - all
    # 5.4.2 works
    image: adminer:5
    restart: unless-stopped
    depends_on:
      mj_db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: mj_db
      ADMINER_DESIGN: dracula
    networks:
      - lan
      - traefik_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_network"
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.auth.basicauth.users=${AUTH_HASH}"
      - "traefik.http.routers.adminer.middlewares=auth"
      - "traefik.http.routers.adminer.entrypoints=websecure"
      - "traefik.http.routers.adminer.rule=Host(`adminer.${DOMAIN}`)"
      - "traefik.http.routers.adminer.tls=true"
      - "traefik.http.routers.adminer.tls.certresolver=leresolver"


